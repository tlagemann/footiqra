# Manual check: can the UEFA association coefficients be fetched from GitHub Actions?
# Prints a sample of the response. Nothing is committed.
name: Probe UEFA coefficients

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch sample
        run: |
          curl -s -m 30 -A "Mozilla/5.0 (compatible; FootiqraBot/1.0; +https://footiqra.com)" -o body.json \
            "https://comp.uefa.com/v2/coefficients?coefficientRange=OVERALL&coefficientType=MEN_ASSOCIATION&language=EN&page=1&pagesize=500&seasonYear=2027"
          python3 - <<'PY'
          import json
          d = json.load(open("body.json"))["data"]
          ms = d["members"]
          de = next(m for m in ms if m["member"]["countryCode"] == "GER")
          print(json.dumps({k: v for k, v in de.items() if k != "member"}, indent=1))
          print(json.dumps(de["member"], indent=1)[:600])
          print("keys of data:", list(d.keys()))
          for m in ms[:12]:
              o = m["overallRanking"]
              print(o["position"], m["member"]["countryCode"], o["totalValue"], o["numberOfTeams"], o["numberOfTeamsStillInPlaying"], o["trend"], [s.get("totalValue") for s in m["seasonRankings"]])
          PY
