# Manual check: can football-data.org deliver a past season with our token?
# Runs the normal import for the chosen season into a throwaway data folder.
# Results appear as notices on the run. With "archive" set, the season is committed
# to data/archive/ (not read by the site; used for model backtests). Nothing is deployed.
name: Probe past season

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season start year, e.g. 2025 for 2025/26"
        required: true
        default: "2025"
      archive:
        description: "Commit the season to data/archive/"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import season into empty data folder
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTIQRA_SEASON: ${{ inputs.season }}
        run: |
          rm -rf data && mkdir data
          set +e
          npm run ingest 2>&1 | tee ingest.log
          code=${PIPESTATUS[0]}
          echo "::notice title=Exit code::$code"
          grep -iE "error|fail|forbidden|403|429|restricted|permission" ingest.log | head -20 | while read -r line; do
            echo "::notice title=Log::$line"
          done
          exit 0
      - name: Summarise
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = d => fs.existsSync(d) ? fs.readdirSync(d, {withFileTypes:true}).flatMap(e => e.isDirectory() ? walk(path.join(d,e.name)) : [path.join(d,e.name)]) : [];
            for (const f of walk("data").filter(f => f.endsWith(".json"))) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              const m = Array.isArray(j) ? j : (j.matches ?? j.rows ?? j.table ?? null);
              const fin = Array.isArray(m) ? m.filter(x => x.status === "FINISHED").length : "";
              const dates = Array.isArray(m) ? m.map(x => x.utcDate).filter(Boolean).sort() : [];
              console.log(`::notice title=${f}::entries=${Array.isArray(m) ? m.length : "?"} finished=${fin} first=${dates[0] ?? ""} last=${dates.at(-1) ?? ""}`);
            }
          '
      - name: Archive season
        if: inputs.archive
        run: |
          season="${{ inputs.season }}"
          mkdir -p /tmp/archive
          cp -r data /tmp/archive/data
          git checkout -- . && git clean -fdq
          git pull -q --rebase
          for f in /tmp/archive/data/matches/*/"$season".json; do
            code=$(basename "$(dirname "$f")")
            mkdir -p "data/archive/matches/$code"
            cp "$f" "data/archive/matches/$code/$season.json"
          done
          cp /tmp/archive/data/teams.json "data/archive/teams-$season.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git commit -qm "data: archive season $season for backtests" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
